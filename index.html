<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Coachly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column app — sticky header, one view at a time, bottom tab bar; cards only for things you tap */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8ECF2; --fg:#0E1B2C; --muted:#5A6A7F; --line:#D8DFE8;
  --accent:#0B3A6E; --accent-2:#2160A8; --accent-soft:#DCE6F3; --on-accent:#FFFFFF;
  --spark:#D98E22; --spark-soft:#FBEBD2; --good:#1D8657; --good-soft:#DCF1E6; --danger:#B4362F;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#09101A; --surface:#111B29; --surface-2:#192637; --fg:#E6ECF4; --muted:#93A2B6; --line:#233246;
  --accent:#86B4EE; --accent-2:#AFCBF2; --accent-soft:#17304E; --on-accent:#07111E;
  --spark:#F0B252; --spark-soft:#3A2A12; --good:#4CC28B; --good-soft:#113224; --danger:#F07A72; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#09101A; --surface:#111B29; --surface-2:#192637; --fg:#E6ECF4; --muted:#93A2B6; --line:#233246;
  --accent:#86B4EE; --accent-2:#AFCBF2; --accent-soft:#17304E; --on-accent:#07111E;
  --spark:#F0B252; --spark-soft:#3A2A12; --good:#4CC28B; --good-soft:#113224; --danger:#F07A72; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1;color:var(--accent)}
.brand span{color:var(--fg)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--spark)}
.pill.lvl .dot{background:var(--accent-2)}

.view{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h2.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:.95;letter-spacing:.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--surface-2);transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.warn{color:var(--danger)}
.btn.warn.armed{background:var(--danger);color:#fff}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--spark-soft);font-size:14px}

.coach{padding:4px 0 0}
.coach .line{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.05}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.day b{font-size:16px;color:var(--fg)}
.day .mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px dashed var(--line)}
.day.done .mark{background:var(--good);border-color:var(--good);color:#fff}
.day.off .mark{border-style:solid;border-color:transparent;color:var(--muted)}
.day.today{border-color:var(--accent-2);box-shadow:0 0 0 1px var(--accent-2) inset}

.plan .exlist{list-style:none;margin:6px 0 14px;padding:0;display:flex;flex-direction:column}
.plan .exlist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.plan .exlist li:last-child{border-bottom:0}

.stepscard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .center b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.ring .center small{font-size:11px;color:var(--muted)}
.stepbtns{display:flex;gap:6px;flex-wrap:wrap}
.stepinput{display:flex;gap:6px;margin-top:8px}
.stepinput input{flex:1;min-width:0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent-2);border-radius:99px;transition:width .5s ease}

input[type=number],input[type=text]{width:100%;padding:10px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typebtn{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:700}
.typebtn small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.typebtn[aria-pressed="true"]{border-color:var(--accent-2);background:var(--accent-soft)}

.ex{display:flex;flex-direction:column;gap:8px}
.ex .name{font-weight:700;font-size:16px;color:var(--accent)}
.sets{display:grid;grid-template-columns:28px 1fr 74px 64px 44px;gap:6px;align-items:center;font-size:14px}
.sets .hd{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sets .prev{color:var(--muted);font-size:13px}
.sets input{padding:8px;text-align:center}
.check{width:44px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:800}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.setrow-done{background:var(--good-soft);border-radius:8px}
.exfoot{display:flex;gap:6px;justify-content:space-between}

.addex{display:flex;gap:6px}
.addex input{flex:1}
.msg{font-size:14px;color:var(--danger)}

.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rest .inner{max-width:560px;margin:0 auto 8px;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.rest .t{font-family:var(--display);font-size:28px;font-weight:800;min-width:62px}
.rest .grow{flex:1;min-width:0}
.rest .track{height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:4px}
.rest .track i{display:block;height:100%;background:var(--on-accent)}
.rest button{background:rgba(255,255,255,.16);border:0;color:inherit;border-radius:8px;padding:6px 8px;font-weight:700;font-size:13px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.chartbox{overflow-x:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.prs{display:flex;flex-direction:column}
.prs div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.prs div:last-child{border-bottom:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:13px}
.badge .ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--display);font-weight:800;font-size:16px}
.badge b{display:block;color:inherit;font-size:14px}
.badge.got{border-style:solid;border-color:var(--spark);background:var(--surface);color:var(--fg)}
.badge.got .ic{background:var(--spark);color:#fff}

details.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0}
details.hist summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.hist summary::-webkit-details-marker{display:none}
details.hist .body{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--spark-soft);color:var(--fg);margin-left:6px}
select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}

.modal{position:fixed;inset:0;z-index:20;background:rgba(5,12,22,.55);display:grid;place-items:center;padding:20px}
.modal .sheet{background:var(--surface);border-radius:18px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.modal .sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modal .sumgrid b{display:block;font-family:var(--display);font-size:28px;font-weight:800}
.modal .sumgrid span{font-size:12px;color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Coach<span>ly</span></div>
    <div class="pills" id="pills"></div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<div id="restSlot"></div>
<nav class="tabs" aria-label="Main">
  <div class="in" id="tabs"></div>
</nav>
<datalist id="exlist"></datalist>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
"use strict";

/* ---------- Plan & exercise library (apartment gym: racks, dumbbells, cables, kettlebells, med balls, rope) ---------- */
const LIB = {
  "Upper Push": [["Dumbbell Bench Press",25,10],["Incline Dumbbell Press",20,10],["Dumbbell Shoulder Press",15,10],["Cable Chest Fly",15,12],["Lateral Raise",8,12],["Rope Triceps Pushdown",20,12]],
  "Lower Push": [["Goblet Squat",35,10],["Barbell Back Squat",65,8],["Bulgarian Split Squat",15,10],["Dumbbell Step-Up",15,10],["Walking Lunge",15,12]],
  "Upper Pull": [["Lat Pulldown",50,10],["Seated Cable Row",45,10],["Single-Arm Dumbbell Row",25,10],["Rope Face Pull",20,12],["Dumbbell Biceps Curl",15,10],["Hammer Curl",15,10]],
  "Lower Pull": [["Romanian Deadlift",65,10],["Hip Thrust",85,10],["Kettlebell Swing",26,15],["Single-Leg RDL",20,10],["Cable Pull-Through",30,12]],
  "Core & More": [["Dead Bug",0,10],["Pallof Press",15,10],["Side Plank (sec)",0,30],["Bird Dog",0,10],["Med Ball Slam",10,12]]
};
const TYPES = Object.keys(LIB);
const SPLIT = {1:"Upper Push",2:"Lower Push",3:"Upper Pull",4:"Lower Pull",5:"Core & More"}; // by getDay()
const REST_SECONDS = 90;
const KEY = "coachly.v1";
const LEVELS = ["Walk-On","Starter","Varsity","Captain","All-Conference","All-American","Legend"];
const XP_PER_LEVEL = 1000;

/* ---------- Small helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids){ const el = document.createElementNS(svgNS, tag); for (const k in attrs||{}) el.setAttribute(k, attrs[k]); for (const c of kids) el.append(c instanceof Node ? c : document.createTextNode(String(c))); return el; }
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmt = n => Math.round(n).toLocaleString();
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const LONGDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const shortDate = k => { const d = fromKey(k); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
const clampNum = (v, min, max) => { const n = parseFloat(v); if (!isFinite(n)) return 0; return Math.min(max, Math.max(min, n)); };
const uid = () => Math.random().toString(36).slice(2,10);
const libEntry = name => { for (const t of TYPES) for (const e of LIB[t]) if (e[0] === name) return e; return null; };

/* ---------- State ---------- */
function sampleState(){
  const today = new Date(); today.setHours(0,0,0,0);
  const workouts = [];
  let week = 0;
  for (let i = 22; i >= 1; i--){
    const d = addDays(today, -i);
    const wd = d.getDay();
    if (wd === 0 || wd === 6) continue;
    if (i === 10 || i === 17) continue; // a couple of missed days, like real life
    if (wd === 1) week++;
    const type = SPLIT[wd];
    const exercises = LIB[type].slice(0,4).map(([name, base, reps]) => {
      const w = base === 0 ? 0 : base + Math.floor(week/1) * (base >= 50 ? 5 : 2.5);
      return { name, sets: [0,1,2].map(j => ({ w, r: Math.max(5, reps - (j===2?2:0)) })) };
    });
    workouts.push({ id: uid(), date: dkey(d), type, minutes: 48 + ((i*7)%17), exercises });
  }
  const steps = {};
  const sampleSteps = [9200,10450,7800,11230,6400,9800,8650];
  for (let i = 7; i >= 1; i--) steps[dkey(addDays(today,-i))] = sampleSteps[7-i];
  steps[dkey(today)] = 6420;
  return { workouts, steps, active: null, sample: true };
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const st = JSON.parse(raw); if (st && Array.isArray(st.workouts) && st.steps) return st; } } catch(e){}
  return sampleState();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let S = load();
let view = "today";
let restEnd = 0, restTotal = REST_SECONDS, restTick = null;
let armed = null; // id of a two-step destructive button that is waiting for its second tap
let formMsg = "";

/* ---------- Derived numbers ---------- */
function sorted(){ return S.workouts.slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }
function analyze(){
  const best = {}, prs = [], prByWorkout = {};
  let volume = 0, sets = 0;
  for (const w of sorted()){
    prByWorkout[w.id] = [];
    for (const ex of w.exercises){
      const top = Math.max(0, ...ex.sets.map(x=>x.w));
      for (const st of ex.sets){ volume += st.w * st.r; sets++; }
      if (best[ex.name] != null && top > best[ex.name].w){ prs.push({name:ex.name, w:top, date:w.date}); prByWorkout[w.id].push(ex.name); }
      if (best[ex.name] == null || top > best[ex.name].w) best[ex.name] = { w: top, date: w.date };
    }
  }
  const tenK = Object.values(S.steps).filter(v => v >= 10000).length;
  const xp = sets*10 + S.workouts.length*50 + prs.length*25 + tenK*20;
  return { best, prs, prByWorkout, volume, sets, tenK, xp };
}
function streak(){
  const done = new Set(S.workouts.map(w=>w.date));
  let d = new Date(); d.setHours(0,0,0,0);
  let n = 0, first = true;
  for (let i = 0; i < 400; i++){
    const wd = d.getDay(), k = dkey(d);
    if (done.has(k)) n++;
    else if (wd !== 0 && wd !== 6 && !first) break; // weekends are rest days and never break a streak
    first = false;
    d = addDays(d, -1);
  }
  return n;
}
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0); const wd = x.getDay(); return addDays(x, wd === 0 ? -6 : 1 - wd); }
function lastPerf(name){
  const list = sorted();
  for (let i = list.length-1; i >= 0; i--){ const ex = list[i].exercises.find(e=>e.name===name); if (ex) return ex.sets; }
  return null;
}
function level(xp){ const i = Math.min(LEVELS.length-1, Math.floor(xp / XP_PER_LEVEL)); return { name: LEVELS[i], idx: i, pct: i === LEVELS.length-1 ? 100 : (xp % XP_PER_LEVEL) / XP_PER_LEVEL * 100, toNext: XP_PER_LEVEL - (xp % XP_PER_LEVEL) }; }

/* ---------- Shell ---------- */
const ICONS = {
  today: "M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
  log: "M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11",
  progress: "M4 19V5M4 19h16M8 15l3-4 3 2 5-6",
  history: "M12 7v5l3 2M3 12a9 9 0 1 0 3-6.7M3 4v4h4"
};
function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...[["today","Today"],["log", S.active ? "Workout •" : "Workout"],["progress","Progress"],["history","History"]].map(([id,label]) => {
    const svg = s("svg",{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor","stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round"}, s("path",{d:ICONS[id]}));
    return h("button",{type:"button","aria-current": view===id ? "page" : null, onclick:()=>go(id)}, svg, label);
  }));
}
function renderPills(a){
  const lv = level(a.xp);
  document.getElementById("pills").replaceChildren(
    h("span",{class:"pill num",title:"Workout streak (weekends don't break it)"}, h("i",{class:"dot"}), streak()+" day streak"),
    h("span",{class:"pill lvl",title:a.xp+" XP"}, h("i",{class:"dot"}), lv.name)
  );
}
function go(v){ view = v; armed = null; formMsg = ""; render(); window.scrollTo({top:0}); }
function render(){
  const a = analyze();
  renderPills(a); renderTabs();
  const app = document.getElementById("app");
  const views = { today: viewToday, log: viewLog, progress: viewProgress, history: viewHistory };
  app.replaceChildren(views[view](a));
  renderRest();
  document.getElementById("exlist").replaceChildren(...TYPES.flatMap(t => LIB[t].map(e => h("option",{value:e[0]}))));
}
function twoStep(id, label, armedLabel, action, cls){

function chart(name){

  const span = hi - lo, step = span <= 10 ? 2.5 : span <= 25 ? 5 : span <= 60 ? 10 : 25;
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;

    svg.append(s("text",{x:L-6,y:y(v)+3,"text-anchor":"end"}, (Math.round(v*10)/10)));
  }
  const line = pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.w).toFixed(1)).join(" ");
  svg.append(s("path",{d: line+` L${x(pts.length-1)} ${H-Bm} L${L} ${H-Bm} Z`, fill:"var(--accent-soft)", stroke:"none"}));
  svg.append(s("path",{d: line, fill:"none", stroke:"var(--accent-2)","stroke-width":2.5,"stroke-linejoin":"round","stroke-linecap":"round"}));
  pts.forEach((p,i)=> svg.append(s("circle",{cx:x(i),cy:y(p.w),r: i===pts.length-1 ? 5 : 3, fill: i===pts.length-1 ? "var(--spark)" : "var(--accent-2)"})));

      h("div",{class:"body"},
        ...w.exercises.map(ex => h("div",{class:"row between"}, h("span",null, ex.name, prs.includes(ex.name) ? h("span",{class:"tag"},"PR") : null), h("span",{class:"muted num"}, ex.sets.map(st=>st.w+"×"+st.r).join("  ")))),
        h("div",{style:"text-align:right;margin-top:6px"}, twoStep("del-"+w.id,"Delete","Tap again to delete", ()=>{ S.workouts = S.workouts.filter(x=>x.id!==w.id); save(); render(); })))));
  });
  return h("div",{class:"view"}, ...kids);
}

/* ---------- Confetti ---------- */
function confetti(n){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1; c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const cs = getComputedStyle(document.documentElement);
  const colors = ["--accent-2","--spark","--good","--accent"].map(v=>cs.getPropertyValue(v).trim());
  const parts = Array.from({length:n}, () => ({ x: innerWidth/2 + (Math.random()-.5)*80, y: innerHeight*0.35, vx: (Math.random()-.5)*9, vy: -Math.random()*9-4, s: 5+Math.random()*5, r: Math.random()*6, vr: (Math.random()-.5)*.3, c: colors[Math.floor(Math.random()*colors.length)] }));
  let frames = 0;
  (function step(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p => { p.vy += .28; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if (++frames < 110) requestAnimationFrame(step); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

render();
if (S.active) ensureTick();
document.addEventListener("keydown", e => { if (e.key === "Escape"){ const m = document.querySelector(".modal"); if (m) m.remove(); } });
})();
</script>
